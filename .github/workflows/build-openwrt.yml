name: Build LiBwrt OpenWrt

on:
  push:
    branches:
      - main
    paths:
      - .config
      - .github/workflows/build-openwrt.yml
  workflow_dispatch:
    inputs:
      ssh:
        description: 'Enable a tmate SSH session before compiling (true/false)'
        required: false
        type: boolean
        default: false
  schedule:
    # Mondays 00:00 UTC. The prepare job allows a build every two weeks (about 2-3 per month).
    - cron: '0 0 * * 1'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  TZ: Asia/Shanghai
  CACHE_TOOLCHAIN: true
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: LiBwrt-OpenWrt
  FILE_PATH: ${{ github.workspace }}/libwrt

jobs:
  prepare:
    name: Check whether this run should build
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.schedule.outputs.should_build }}
    steps:
      - name: Check schedule
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Pushes and manual runs always build. Scheduled runs build every two weeks.
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The anchor is a Monday; changing it only shifts which weeks are "on".
          anchor=$(date -u -d '2026-01-05' +%s)
          now=$(date -u +%s)
          if [ $(( (now - anchor) / 604800 % 2 )) -eq 0 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Off week: skipping this scheduled build to conserve Actions minutes."
          fi

  build:
    name: Build firmware
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo bash -c 'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt-get -yqq install dos2unix libfuse-dev
          sudo -E apt-get -yqq autoremove --purge || true
          sudo -E apt-get -yqq autoclean
          sudo -E apt-get clean
          sudo systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"

      - name: Clone LiBwrt and capture upstream changes
        run: |
          git clone --depth 1 --single-branch -b "$REPO_BRANCH" "$REPO_URL" "$FILE_PATH"
          cd "$FILE_PATH"

          version_log=$(git log --since='24 hours ago' --pretty=format:'%h %s' --no-merges -- . ':(exclude)scripts/feeds' || true)
          if [ -z "$version_log" ]; then
            version_log='No upstream changes in the last 24 hours.'
          fi

          # Percent-encode newlines so the value can be stored in GITHUB_ENV.
          version_log="${version_log//'%'/'%25'}"
          version_log="${version_log//$'\n'/'%0A'}"
          version_log="${version_log//$'\r'/'%0D'}"
          echo "VERSION_LOG=$version_log" >> "$GITHUB_ENV"

      - name: Update and install feeds
        working-directory: ${{ env.FILE_PATH }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply repository .config
        working-directory: ${{ env.FILE_PATH }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/.config" ]; then
            echo "::error::.config not found in the repository root."
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/.config" .config
          make defconfig

      - name: SSH debugging session
        if: github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          detached: false

      - name: Read target configuration
        working-directory: ${{ env.FILE_PATH }}
        run: |
          device_target=$(sed -n 's/^CONFIG_TARGET_BOARD="\(.*\)"$/\1/p' .config)
          device_subtarget=$(sed -n 's/^CONFIG_TARGET_SUBTARGET="\(.*\)"$/\1/p' .config)
          if [ -z "$device_target" ] || [ -z "$device_subtarget" ]; then
            echo "::error::Could not read target information from .config."
            exit 1
          fi
          echo "DEVICE_TARGET=$device_target" >> "$GITHUB_ENV"
          echo "DEVICE_SUBTARGET=$device_subtarget" >> "$GITHUB_ENV"
          echo "Target: $device_target/$device_subtarget"

      - name: Cache toolchain and build output
        if: env.CACHE_TOOLCHAIN == 'true'
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: false
          mixkey: ${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
          prefix: ${{ env.FILE_PATH }}

      - name: Download package sources
        working-directory: ${{ env.FILE_PATH }}
        run: |
          make download -j"$(nproc)"
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        working-directory: ${{ env.FILE_PATH }}
        run: |
          make -j"$(nproc)" || make -j1 V=s
          echo "FILE_DATE=$(date +%Y.%m.%d)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_ENV"

      - name: Collect firmware and manifest
        run: |
          target_dir="$FILE_PATH/bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET"
          if [ ! -d "$target_dir" ]; then
            echo "::error::Firmware output directory not found: $target_dir"
            exit 1
          fi
          cd "$target_dir"

          rm -rf packages
          cp "$FILE_PATH/.config" ./build.config

          manifest_file=$(find . -maxdepth 1 -type f \( -name '*.manifest' -o -name '*.manifest.txt' \) | head -n 1)
          if [ -n "$manifest_file" ]; then
            echo "KERNEL_VER=$(grep -m1 '^kernel - ' "$manifest_file" | awk -F ' - ' '{print $2}')" >> "$GITHUB_ENV"
            echo "LUCI_VER=$(grep -m1 '^luci - ' "$manifest_file" | awk -F ' - ' '{print $2}')" >> "$GITHUB_ENV"
            echo "BASE_VER=$(grep -m1 '^base-files - ' "$manifest_file" | awk -F ' - ' '{print $2}')" >> "$GITHUB_ENV"
          else
            echo "::warning::Manifest file not found; release notes will omit version details."
            echo "KERNEL_VER=Unknown" >> "$GITHUB_ENV"
            echo "LUCI_VER=Unknown" >> "$GITHUB_ENV"
            echo "BASE_VER=Unknown" >> "$GITHUB_ENV"
          fi

          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware_${{ env.DEVICE_TARGET }}_${{ env.DEVICE_SUBTARGET }}_${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE_PATH }}

      - name: Publish or update release
        if: env.FIRMWARE_RELEASE == 'true'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ env.FIRMWARE_TAG }}
          name: R${{ env.FILE_DATE }} ${{ env.FIRMWARE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.FIRMWARE_PATH }}/*
          body: |
            **OpenWrt firmware for ${{ env.DEVICE_TARGET }} / ${{ env.DEVICE_SUBTARGET }}**

            ### 固件信息
            - 编译时间: ${{ env.BUILD_DATE }}
            - 平台架构: ${{ env.DEVICE_TARGET }} - ${{ env.DEVICE_SUBTARGET }}
            - 固件源码: ${{ env.REPO_URL }}
            - 源码分支: ${{ env.REPO_BRANCH }}
            - 默认地址: 192.168.1.1
            - 默认密码: 无

            ### 版本详情
            - Kernel: ${{ env.KERNEL_VER }}
            - LuCI: ${{ env.LUCI_VER }}
            - Base: ${{ env.BASE_VER }}

            ### 源码更新日志（最近 24 小时）
            ${{ env.VERSION_LOG }}

            > 本项目只维护一个 Release 条目（标签 `${{ env.FIRMWARE_TAG }}`）。每次编译成功都会更新该条目，而不是新建条目。
